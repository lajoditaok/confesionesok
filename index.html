<!DOCTYPE html>
<html lang="es" data-view="form">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noche de Confesiones · Jodita OK</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--red:#e4001b;--red2:#7a000d;--yellow:#ffd21a;--black:#0a0204;--card:#160509}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Montserrat,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0%,#5a0510 0%,var(--black) 65%) fixed;overflow-x:hidden}
img{max-width:100%}
.lcd{font-family:VT323,monospace;color:#ff2a3d;text-shadow:0 0 8px rgba(255,42,61,.55)}
.hidden{display:none!important}
button{font:800 1.05rem Montserrat,sans-serif;border:0;border-radius:12px;padding:15px 22px;cursor:pointer;color:#fff;background:var(--red)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}

/* Formulario */
.wrap{max-width:520px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.wrap .titulo{width:100%}
.sub{font-weight:700;color:var(--yellow);font-size:1.05rem}
.phone{width:100%;background:var(--card);border:3px solid var(--red);border-radius:18px;padding:14px;box-shadow:0 0 30px rgba(228,0,27,.35)}
.phone .tag{font-size:1.5rem;text-align:left}
.phone textarea{width:100%;min-height:150px;resize:none;background:transparent;border:0;outline:0;font-family:VT323,monospace;font-size:1.9rem;line-height:1.1;color:#ff2a3d;text-shadow:0 0 8px rgba(255,42,61,.55)}
.phone textarea::placeholder{color:#7a1a24}
.count{text-align:right;font-size:1.2rem;color:#a03340}
.send{width:100%;font-size:1.25rem;background:linear-gradient(#ff3b4e,var(--red) 55%,var(--red2));box-shadow:0 6px 0 #4a0008}
.send:active{transform:translateY(4px);box-shadow:0 2px 0 #4a0008}
.msg{font-weight:700;min-height:1.4em}.msg.ok{color:var(--yellow)}.msg.err{color:#ff8a94}
.logo-foot{width:110px;opacity:.9}

/* Pantalla pública */
body.screen{height:100vh;overflow:hidden}
.stage{height:100vh;display:grid;grid-template-columns:minmax(280px,30%) 1fr;gap:2.5vw;padding:3vh 2.5vw}
.left{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;gap:2vh}
.left .titulo{width:100%}
.qrbox{background:#fff;padding:1.4vh;border-radius:18px;line-height:0;box-shadow:0 0 0 5px var(--red),0 0 50px rgba(228,0,27,.6);animation:glow 2.4s ease-in-out infinite}
.qrbox canvas,.qrbox img{width:min(22vw,34vh)!important;height:auto!important}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--yellow),0 0 70px rgba(255,210,26,.55)}}
.cta{font-weight:800;font-size:clamp(1rem,1.7vw,1.9rem);color:var(--yellow);line-height:1.15}
.left .logo{width:min(8vw,12vh)}
.right{position:relative;display:flex;align-items:center;justify-content:center;perspective:1400px;min-height:0}
#idle{text-align:center;animation:float 3.5s ease-in-out infinite}
#idle img{width:min(22vw,40vh)}
#idle p{font-family:VT323,monospace;font-size:clamp(2rem,4vw,4.5rem);color:#ff2a3d;text-shadow:0 0 14px rgba(255,42,61,.7);margin-top:2vh}
@keyframes float{50%{transform:translateY(-14px) rotate(-1.5deg)}}
#card{width:100%;max-width:62vw;background:var(--card);border:4px solid var(--red);border-radius:28px;padding:4vh 3vw 3vh;box-shadow:0 0 90px rgba(228,0,27,.65),inset 0 0 40px rgba(228,0,27,.2);opacity:0}
#card.in{animation:cin .9s cubic-bezier(.2,1.3,.4,1) forwards}
#card.out{animation:cout .7s ease-in forwards}
@keyframes cin{from{opacity:0;transform:translateY(60vh) rotateX(70deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes cout{to{opacity:0;transform:translateX(40vw) rotate(14deg) scale(.7)}}
#card .n{font-size:clamp(1.6rem,3vw,3.4rem)}
#card .t{font-family:VT323,monospace;color:#ff2a3d;text-shadow:0 0 12px rgba(255,42,61,.7);font-size:clamp(2.4rem,5.2vw,6rem);line-height:1;word-break:break-word;min-height:3em;margin-top:2vh}
#card .t::after{content:"▌";animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{height:10px;background:#2b1218;border-radius:9px;overflow:hidden;margin-top:2vh}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--yellow),var(--red));transform-origin:left}
#card.in .bar i{animation:drain 10s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.spark{position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;pointer-events:none;animation:boom 1.3s ease-out forwards}
@keyframes boom{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@media (max-width:800px){body.screen{overflow:auto;height:auto}.stage{height:auto;grid-template-columns:1fr}#card{max-width:100%}}
@media (prefers-reduced-motion:reduce){#idle,.qrbox{animation:none}}

/* Admin */
.admin{max-width:1100px;margin:0 auto;padding:20px}
.admin h1{font-size:1.6rem}
.admin h2{font-size:1.1rem;margin:22px 0 10px;color:var(--yellow)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.login{max-width:360px;margin:12vh auto;display:flex;flex-direction:column;gap:12px}
.login input{padding:14px;border-radius:10px;border:2px solid var(--red2);background:var(--card);color:#fff;font:600 1rem Montserrat}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--red2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row .txt{flex:1;font-family:VT323,monospace;font-size:1.7rem;line-height:1.05;word-break:break-word}
.row.pend{border-color:var(--yellow);animation:flash 1s 2}
@keyframes flash{50%{background:#3a0b14}}
.yes{background:#1a9c4a}.no{background:var(--red2)}.ghost{background:#2b1218}
.small{font-size:.9rem;padding:10px 14px}
.hint{color:#c58a92;font-size:.9rem}
</style>
</head>

  authDomain: "lajoditaok.firebaseapp.com",
  projectId: "lajoditaok",
  storageBucket: "lajoditaok.firebasestorage.app",
  messagingSenderId: "292261003770",
  appId: "1:292261003770:web:1f7453f78ae60044d4a443"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore(), auth = firebase.auth();
const col = db.collection('confesiones');
const $ = id => document.getElementById(id);
const view = document.documentElement.dataset.view;
const root = new URL('./', location.href).href;
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Formulario (lo que abre el QR) ---- */
if (view === 'form') {
  $('vForm').classList.remove('hidden');
  const t = $('txt'), m = $('fmsg');
  t.addEventListener('input', () => $('cnt').textContent = t.value.length);
  $('send').onclick = async () => {
    const text = t.value.trim();
    m.className = 'msg';
    if (!text) { m.textContent = 'Escribí algo primero.'; m.classList.add('err'); return; }
    if (Date.now() - (+localStorage.getItem('lastSend') || 0) < 20000) { m.textContent = 'Esperá unos segundos antes de mandar otra.'; m.classList.add('err'); return; }
    $('send').disabled = true;
    try {
      await col.add({ text, status: 'pending', ts: firebase.firestore.FieldValue.serverTimestamp() });
      localStorage.setItem('lastSend', Date.now());
      t.value = ''; $('cnt').textContent = 0;
      m.textContent = '¡Enviada! Si pasa el filtro, la vas a ver en pantalla.'; m.classList.add('ok');
    } catch (e) { m.textContent = 'No se pudo enviar: ' + (e.code || e.message); m.classList.add('err'); }
    $('send').disabled = false;
  };
}

/* ---- Pantalla pública: QR fijo + confesiones de a una, 10 seg ---- */
if (view === 'screen') {
  document.body.classList.add('screen');
  $('vScreen').classList.remove('hidden');
  new QRCode($('qr'), { text: root, width: 512, height: 512, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
  const t0 = Date.now(), queue = [], done = new Set();
  let busy = false;
  col.where('status', '==', 'approved').onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'removed') return;
      const c = ch.doc.data(), key = ch.doc.id + ':' + c.showAt;
      if (!c.showAt || c.showAt < t0 - 30000 || done.has(key)) return;
      done.add(key); queue.push(c);
    });
    run();
  });
  async function run() {
    if (busy) return; busy = true;
    while (queue.length) await show(queue.shift());
    busy = false;
  }
  function burst() {
    const st = $('stage');
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span'), a = Math.random() * 6.28, d = 150 + Math.random() * 300;
      s.className = 'spark';
      s.style.cssText = `background:${i % 2 ? '#ffd21a' : '#e4001b'};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d}px`;
      st.appendChild(s); setTimeout(() => s.remove(), 1400);
    }
  }
  async function show(c) {
    const card = $('card'), tx = $('ct');
    $('cn').textContent = 'CONFESIÓN #' + pad(c.n || 0);
    tx.textContent = '';
    $('idle').classList.add('hidden');
    card.classList.remove('hidden', 'out'); void card.offsetWidth; card.classList.add('in');
    burst();
    await sleep(800);
    const step = Math.min(45, 3000 / c.text.length);
    for (let i = 1; i <= c.text.length; i++) { tx.textContent = c.text.slice(0, i); await sleep(step); }
    await sleep(Math.max(0, 10000 - 800 - step * c.text.length));
    card.classList.remove('in'); card.classList.add('out');
    await sleep(700);
    card.classList.add('hidden'); card.classList.remove('out');
    if (!queue.length) $('idle').classList.remove('hidden');
    await sleep(400);
  }
}

/* ---- Admin ---- */
if (view === 'admin') {
  $('vAdmin').classList.remove('hidden');
  let unsub = null, prevPend = -1, maxN = 0;
  const beep = () => { try { const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); o.stop(a.currentTime + .15); } catch (e) {} };
  $('login').onsubmit = async e => {
    e.preventDefault(); $('lmsg').textContent = '';
    try { await auth.signInWithEmailAndPassword($('em').value, $('pw').value); }
    catch (err) { $('lmsg').textContent = 'No se pudo entrar: ' + (err.code || err.message); }
  };
  $('out').onclick = () => auth.signOut();
  $('openScr').onclick = () => window.open(root + 'pantalla.html', 'pantalla', 'width=1280,height=720');
  auth.onAuthStateChanged(user => {
    $('login').classList.toggle('hidden', !!user);
    $('panel').classList.toggle('hidden', !user);
    if (unsub) { unsub(); unsub = null; }
    if (!user) return;
    unsub = col.onSnapshot(snap => {
      const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const pend = all.filter(c => c.status === 'pending').sort((a, b) => (a.ts?.seconds || 0) - (b.ts?.seconds || 0));
      const appr = all.filter(c => c.status === 'approved').sort((a, b) => (b.n || 0) - (a.n || 0));
      maxN = Math.max(0, ...appr.map(c => c.n || 0));
      if (prevPend >= 0 && pend.length > prevPend) beep();
      prevPend = pend.length;
      $('np').textContent = pend.length; $('na').textContent = appr.length;
      $('pend').innerHTML = pend.length ? pend.map(c => `<div class="row pend"><div class="txt">${esc(c.text)}</div>
        <button class="yes" data-a="ok" data-id="${c.id}">Aceptar</button><button class="no" data-a="del" data-id="${c.id}">Rechazar</button></div>`).join('')
        : '<p class="hint">No hay mensajes pendientes.</p>';
      $('appr').innerHTML = appr.map(c => `<div class="row"><div class="txt"><span class="lcd">#${pad(c.n)}</span> ${esc(c.text)}</div>
        <button class="yes small" data-a="again" data-id="${c.id}">Mostrar de nuevo</button><button class="ghost small" data-a="del" data-id="${c.id}">Borrar</button></div>`).join('');
    }, err => { $('lmsg').textContent = 'Error: ' + err.code; });
  });
  $('panel').onclick = async e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    b.disabled = true;
    const ref = col.doc(b.dataset.id), a = b.dataset.a;
    if (a === 'ok') await ref.update({ status: 'approved', n: ++maxN, showAt: Date.now() });
    else if (a === 'again') { await ref.update({ showAt: Date.now() }); setTimeout(() => b.disabled = false, 1500); }
    else await ref.delete();
  };
}
</script>
